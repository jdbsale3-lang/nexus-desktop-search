name: Domain Transfer Watch

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check-registrar:
    runs-on: ubuntu-latest
    steps:
      - name: Probe .com registry (Verisign RDAP)
        id: rdap
        shell: bash
        run: |
          curl -s --max-time 30 https://rdap.verisign.com/com/v1/domain/zeusaiintelligence.com -o /tmp/rdap.json
          python3 - <<'PY'
          import json
          import os
          j = json.load(open('/tmp/rdap.json'))
          reg = ''
          for e in j.get('entities', []):
              if 'registrar' in e.get('roles', []):
                  for item in e.get('vcardArray', [[], []])[1]:
                      if item[0] == 'fn':
                          reg = item[3]
          locked = 'client transfer prohibited' in j.get('status', [])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('registrar=' + (reg or 'UNRESOLVED') + '\n')
              f.write('locked=' + str(locked) + '\n')
          PY

      - name: Report status
        run: echo "::notice::registrar=${{ steps.rdap.outputs.registrar }} | transfer lock=${{ steps.rdap.outputs.locked }}"

      - name: Open issue when the registrar flips to Cloudflare
        if: ${{ steps.rdap.outputs.registrar != 'IONOS SE' && steps.rdap.outputs.registrar != 'UNRESOLVED' && steps.rdap.outputs.registrar != '' }}
        uses: actions/github-script@v7
        env:
          REGISTRAR: ${{ steps.rdap.outputs.registrar }}
        with:
          script: |
            const reg = process.env.REGISTRAR;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 50
            });
            const already = existing.some(i => i.title.startsWith('[TRANSFER] COMPLETE'));
            if (!already) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '[TRANSFER] COMPLETE — zeusaiintelligence.com now registered at ' + reg,
                body: 'The .com registry now reports registrar = **' + reg + '** (was IONOS SE).\n\n' +
                      'Transfer to Cloudflare Registrar has completed. Final steps:\n' +
                      '1. Verify site: https://zeusaiintelligence.com → 200, headers 5/5\n' +
                      '2. Confirm Cloudflare → Domains → Registrations lists the domain Active\n' +
                      '3. Close the IONOS account (delete-all guide Steps 6–7)\n' +
                      '4. Tide recurring check: no IONOS direct debit\n\n' +
                      'See kali/IONOS-TRANSFER-CHECKLIST.md (Phase 3).\n' +
                      'All IP belongs to Darren Birch — ZEUSTRUSTAEGISSECURITY LTD.'
              });
              console.log('Issue opened.');
            } else {
              console.log('Issue already open; nothing to do.');
            }

      - name: Warn on transfer lock
        if: ${{ steps.rdap.outputs.locked == 'True' }}
        run: echo "::warning::Transfer lock still enabled at IONOS — disable at Domains & SSL → Renewal & transfer → Domain transfer lock"