# ZEUS security headers — nginx snippet (v2: CSP aligned to the Command Centre)
# v2 CHANGELOG: the v1 CSP allowed only 'self', which BLOCKED the ZEUS brain
# (apiaegissecurity.tech), the Gemini brain + websocket, ElevenLabs voice (https+wss),
# Deepgram STT (wss), weather/news feeds, the ElevenLabs widget bundle and Fontshare.
# v2 allowlists exactly those origins — still no wildcard for scripts, still
# frame-ancestors 'self', base-uri/form-action locked.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), interest-cohort=()" always;

# CSP v2 — the Command Centre needs these origins. Keep this list tight:
# add only what the page actually calls; never '*' for script-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://api.fontshare.com; font-src 'self' data: https://api.fontshare.com; img-src 'self' data: blob: https:; connect-src 'self' https://cloudflareinsights.com https://apiaegissecurity.tech https://api.open-meteo.com https://api.duckduckgo.com https://api.openweathermap.org https://generativelanguage.googleapis.com https://api.elevenlabs.io https://api.us.elevenlabs.io https://api.deepgram.com wss://api.elevenlabs.io wss://api.us.elevenlabs.io wss://api.deepgram.com wss://generativelanguage.googleapis.com https://*.higgsfield.app; media-src 'self' blob: https:; frame-src 'self' https://*.elevenlabs.io; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;