# ZEUS flagship security headers — nginx hardening config
# Fixes the five nikto findings from the 2026-09-20 estate scan:
#   strict-transport-security · content-security-policy · x-content-type-options
#   referrer-policy · permissions-policy   (+ x-frame-options, CSP frame-ancestors)
# Add inside the server{} block for zeusaiintelligence.com, then:
#   nginx -t && systemctl reload nginx
# Re-verify: docker exec kali-aegis bash -c "python3 /aegis/work/kali/kali-scan-hook.py https://zeusaiintelligence.com --tools nikto"

    # --- Transport security (HSTS) ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- Clickjacking + framing ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # --- CSP (estate-tuned: self + the two Cloudflare edge hosts) ---
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # --- Referrer + feature policy ---
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # --- Suppress server banner ---
    server_tokens off;