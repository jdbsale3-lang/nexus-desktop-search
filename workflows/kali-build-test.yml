name: Kali Build Test

on:
  push:
    paths:
      - 'kali/**'
      - '.github/workflows/kali-build-test.yml'
  pull_request:
    paths:
      - 'kali/**'
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build full image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./kali
          file: ./kali/Dockerfile
          push: false
          load: true
          tags: kali-aegis:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify full-image tools (gate)
        run: |
          set -e
          MISSING=""
          # every binary the estate relies on must be present inside the image
          for b in nmap nuclei sqlmap burpsuite msfconsole searchsploit hashcat john \
                   hydra wireshark bettercap ghidra radare2 responder impacket-psexec cheat; do
            if ! docker run --rm --entrypoint /bin/bash kali-aegis:test -c "command -v $b >/dev/null 2>&1"; then
              echo "MISSING: $b"
              MISSING="$MISSING $b"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Kali build test failed — missing binaries:$MISSING"
            exit 1
          fi
          echo "All 15 estate binaries verified inside kali-aegis:test"

      - name: Build slim image
        id: build-slim
        uses: docker/build-push-action@v6
        with:
          context: ./kali
          file: ./kali/Dockerfile.slim
          push: false
          load: true
          tags: kali-aegis-slim:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify slim-image tools (gate)
        run: |
          set -e
          MISSING=""
          for b in nmap nuclei sqlmap ffuf gobuster nikto wpscan subfinder httpx; do
            if ! docker run --rm --entrypoint /bin/bash kali-aegis-slim:test -c "command -v $b >/dev/null 2>&1"; then
              echo "MISSING: $b"
              MISSING="$MISSING $b"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Kali slim build test failed — missing binaries:$MISSING"
            exit 1
          fi
          echo "All 9 slim binaries verified inside kali-aegis-slim:test"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kali-build-test-logs
          path: /tmp/kali-build
          if-no-files-found: ignore