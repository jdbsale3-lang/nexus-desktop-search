name: Kali Image Build

on:
  push:
    paths:
      - 'kali/**'
      - '.github/workflows/kali-image-build.yml'
  workflow_dispatch: {}
  schedule:
    # weekly rebuild so the image tracks Kali rolling updates
    - cron: '23 5 * * 1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base image (cache + tag)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./kali
          file: ./kali/Dockerfile
          push: false
          load: true
          tags: kali-aegis:1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build slim variant (verified package set, smaller)
        id: build-slim
        uses: docker/build-push-action@v6
        with:
          context: ./kali
          file: ./kali/Dockerfile.slim
          push: false
          load: true
          tags: kali-aegis-slim:1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify built images contain the tools
        run: |
          set -e
          for img in kali-aegis:1.0 kali-aegis-slim:1.0; do
            echo "--- $img ---"
            docker run --rm --entrypoint bash "$img" -c \
              'for b in nmap nuclei sqlmap msfconsole searchsploit hashcat; do command -v $b >/dev/null 2>&1 && echo "OK $b" || echo "MISS $b"; done'
          done

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kali-build-failure-log
          path: /tmp/kali-build.log
          if-no-files-found: ignore